[package]
name = "maillet"
version = "0.6.0"
edition = "2021"
rust-version = "1.90"
description = "Lightweight tray mail client: watches IMAP mailboxes, shows new mails in the tray and in a compact window"
authors = ["Bert Speckels <skrrytch@speckels.net>"]
license = "MIT"
repository = "https://github.com/Skrrytch/Maillet"
keywords = ["mail", "imap", "tray", "tauri", "otp"]
categories = ["email", "authentication", "gui"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
keyring = { version = "3", features = ["sync-secret-service"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"
mail-parser = "0.11.9"
ammonia = "4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
ksni = "0.3"
notify-rust = "4"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Activating the popup window on X11 (focus-stealing prevention), see app/windows.rs
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
