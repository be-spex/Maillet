<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maillet – Click-Dummy</title>
<style>
:root{
  --bg:#f4f4f7; --panel:#ffffff; --panel2:#f9f9fb; --hover:#f1f1f6; --text:#17171f; --muted:#6c6c7e; --faint:#a0a0b2;
  --line:#e6e6ee; --accent:#6d5dfc; --accent-soft:#efedff; --accent-2:#22c3b5; --ok:#12b07f; --warn:#f2a20c; --danger:#e5484d;
  --shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px rgba(20,20,40,.06); --shadow-lg:0 20px 60px rgba(20,20,40,.18);
  --r:14px; --r-sm:9px;
  --font:"Inter","Cantarell","Noto Sans","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
}
[data-theme=dark]{
  --bg:#0e0f14; --panel:#171821; --panel2:#1c1e28; --hover:#22242f; --text:#ececf4; --muted:#9a9bb2; --faint:#62647a;
  --line:#272938; --accent:#8b7dff; --accent-soft:#25223f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:76px 1fr;height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;margin-bottom:14px;box-shadow:0 6px 18px rgba(109,93,252,.35)}
.rail .nav{position:relative;width:56px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:550}
.rail .nav:hover{background:var(--hover);color:var(--text)}
.rail .nav.on{background:var(--accent-soft);color:var(--accent)}
.rail .nav .badge{position:absolute;top:4px;right:6px}
.rail .spacer{flex:1}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px)}
.search-trigger{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);color:var(--muted);text-align:left}
.search-trigger:hover{border-color:var(--accent)}
.search-trigger span{flex:1}
.top .grow{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;color:var(--muted);font-weight:550;font-size:13px}
.tbtn:hover{background:var(--hover);color:var(--text)}
.tbtn.on{background:var(--accent-soft);color:var(--accent)}
#view{flex:1;overflow:auto;padding:22px 26px 90px}

/* ---------- Generic ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:12px 18px;font-size:14px;border-radius:12px}
.btn.big kbd{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.panel>header h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:700;display:flex;align-items:center;gap:7px}
.panel>header .grow{flex:1}
.link{color:var(--accent);font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.chip .dot,.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.chip.topic{background:color-mix(in srgb,var(--c) 13%,var(--panel));border-color:color-mix(in srgb,var(--c) 30%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.chip.sug{border-style:dashed;color:var(--accent);background:transparent}
.chip.sug:hover{background:var(--accent-soft)}
.chip.ghost{background:transparent;border-style:dashed}
.chip.auto::after{content:"auto";font-size:9.5px;opacity:.65;text-transform:uppercase;letter-spacing:.05em}
.av{--h:250;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;
  background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 45% 35%)}
[data-theme=dark] .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}
.av.lg{width:46px;height:46px;font-size:16px}
.av.xs{width:24px;height:24px;font-size:10px;border:2px solid var(--panel)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.section-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.section-title h1{flex:1}

/* ---------- Home ---------- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.hero>div{flex:1}
.hero p{margin:4px 0 0}
.hero b{color:var(--text)}
.otp-strip{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:stretch}
.otp-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.otp{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 18%,transparent);text-align:left;animation:pop .35s ease}
.otp:hover{transform:translateY(-1px)}
.otp small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.otp .code{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em}
.ring{--p:1;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--panel)}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1100px){.home-grid{grid-template-columns:1fr}}
.side-col{display:flex;flex-direction:column;gap:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px 12px}
.filters .sep{width:1px;background:var(--line);margin:0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding:4px 16px 16px}
.mcard{position:relative;display:flex;flex-direction:column;gap:7px;padding:13px 14px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;animation:pop .3s ease both}
.mcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.mcard.unread::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent)}
.mcard.dragging{opacity:.4;transform:scale(.97)}
.mcard.g-rauschen{opacity:.72}
.mc-head{display:flex;gap:10px;align-items:center}
.mc-from{flex:1;min-width:0;line-height:1.25}
.mc-from b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-from small{color:var(--muted);font-size:11.5px}
.mc-subj{font-weight:650;font-size:13.5px;line-height:1.3}
.mc-prev{color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc-foot{display:flex;align-items:center;gap:6px;min-height:26px}
.mc-foot .grow{flex:1}
.mc-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.mcard:hover .mc-acts,.mcard:focus-within .mc-acts{opacity:1}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--accent)}
.pinmark{color:var(--accent)}
.grp-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.sticky-list{display:flex;flex-direction:column;gap:8px;padding:6px 14px 14px}
.sticky{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c,#f2a20c) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--c,#f2a20c) 25%,transparent);cursor:pointer;text-align:left;width:100%}
.sticky:hover{border-color:color-mix(in srgb,var(--c,#f2a20c) 55%,transparent)}
.sticky b{display:block;font-size:13px}
.sticky small{color:var(--muted)}
.sticky .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 16px;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row .grow{flex:1;min-width:0}
.row .t{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-pad{padding:4px 0 10px}
.topic-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:0;width:100%;text-align:left;transition:background .12s}
.topic-row:hover{background:var(--hover)}
.topic-row .bar{width:4px;height:22px;border-radius:3px;background:var(--c)}
.topic-row .grow{flex:1;font-weight:600}
.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)!important}
.due{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.due.heute{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--text))}
.due.ue{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.acc-row{display:flex;align-items:center;gap:10px;padding:7px 16px}
.acc-row .grow{flex:1}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.live.local{background:var(--accent-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-2) 20%,transparent)}
.hint-line{font-size:12px;color:var(--faint);padding:0 16px 14px;display:flex;gap:6px;align-items:center}

/* ---------- Dock ---------- */
#dock{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);display:flex;gap:8px;padding:10px;border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-lg);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),opacity .2s;opacity:0;pointer-events:none;z-index:40;max-width:94vw;flex-wrap:wrap;justify-content:center}
#dock.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.dz{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px;padding:10px 8px;border-radius:12px;border:1.5px dashed var(--line);font-size:11.5px;font-weight:650;color:var(--muted);transition:all .12s}
.dz.topic{border-color:color-mix(in srgb,var(--c) 45%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text))}
.dz.drop-over{transform:scale(1.08);border-style:solid}
.dz .dsep{width:1px}
.dock-sep{width:1px;background:var(--line);margin:4px 2px}

/* ---------- Reader ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,10,20,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#reader{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column}
#reader.show{transform:none}
.rd-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.rd-top .grow{flex:1}
.rd-scroll{flex:1;overflow:auto;padding:20px 26px 40px}
.rd-head{display:flex;gap:14px;align-items:center}
.rd-head .grow{flex:1;min-width:0}
.rd-head small{color:var(--muted)}
.rd-subj{font-size:21px;letter-spacing:-.01em;margin:16px 0 10px;line-height:1.25}
.rd-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rd-actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ab{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--panel)}
.ab:hover{color:var(--text);border-color:var(--faint)}
.ab.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.ab kbd{padding:0 4px;font-size:10px}
.finds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
.finds>span{font-size:11.5px;font-weight:700;color:var(--accent);display:flex;gap:5px;align-items:center;margin-right:4px}
.find{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px}
.find:hover{border-color:var(--accent);color:var(--accent)}
.find em{font-style:normal;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.rd-body{white-space:pre-wrap;font-size:15px;line-height:1.65;max-width:620px}
.rd-body::selection,.rd-body *::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.att-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.att{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600}
.related{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.related h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:center;margin-top:20px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:550}
.offline-badge{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 12%,transparent);padding:3px 8px;border-radius:6px}
#selbubble{position:fixed;display:none;gap:4px;padding:5px;border-radius:11px;background:var(--text);color:var(--panel);box-shadow:var(--shadow-lg);z-index:60;transform:translate(-50%,-110%)}
#selbubble button{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:650}
#selbubble button:hover{background:rgba(127,127,127,.25)}

/* ---------- Popovers / Modals ---------- */
#pop{position:fixed;z-index:70;display:none;min-width:280px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;animation:pop .15s ease}
#pop input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);outline:none;margin-bottom:6px}
#pop input:focus{border-color:var(--accent)}
.pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;font-weight:550}
.pi:hover,.pi.sel{background:var(--hover)}
.pi .grow{flex:1}
.pi kbd{font-size:10px}
.pop-hint{font-size:11.5px;color:var(--faint);padding:6px 10px 2px;border-top:1px solid var(--line);margin-top:6px}
.pop-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 10px}
#modal{position:fixed;inset:0;z-index:65;display:none;place-items:center;background:rgba(10,10,20,.35);backdrop-filter:blur(2px)}
#modal.show{display:grid}
.dlg{width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px 24px;animation:pop .2s ease}
.dlg h3{margin:0 0 4px;font-size:18px;display:flex;gap:9px;align-items:center}
.dlg .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.dlg label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.dlg input[type=text],.dlg textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none}
.dlg input[type=text]:focus,.dlg textarea:focus{border-color:var(--accent);background:var(--panel)}
.dlg textarea{min-height:90px;resize:vertical}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 11px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.src{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:9px;background:var(--panel2)}
.check{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.folder-pick{border:1px solid var(--line);border-radius:11px;padding:6px;max-height:220px;overflow:auto}
.fp{display:flex;gap:8px;align-items:center;width:100%;padding:7px 9px;border-radius:8px;text-align:left;font-weight:550}
.fp:hover{background:var(--hover)}
.fp.on{background:var(--accent-soft);color:var(--accent)}
.fp .grow{flex:1}
.path{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--panel2)}
.tagsug{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}

/* ---------- Toasts / Notifications ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:12px;background:var(--text);color:var(--panel);box-shadow:var(--shadow-lg);font-weight:550;font-size:13px;animation:up .25s ease}
.toast button{padding:5px 10px;border-radius:8px;font-weight:700;color:var(--accent-2)}
.toast button:hover{background:rgba(127,127,127,.25)}
#notify{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:10px;z-index:90}
.note{width:360px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:slide .3s ease}
.note .nh{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.note .nh .mini{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
.note .nh .grow{flex:1}
.note b{display:block;margin:7px 0 2px;font-size:13.5px}
.note p{margin:0;color:var(--muted);font-size:12.5px}
.note .na{display:flex;gap:6px;margin-top:10px}
.note .na button{flex:1;padding:7px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:650}
.note .na button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Triage ---------- */
.triage{max-width:760px;margin:0 auto}
.tr-top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.progress{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .3s}
.stack{position:relative;padding-bottom:22px}
.stack .ghostcard{position:absolute;left:24px;right:24px;height:60px;bottom:6px;border-radius:18px;background:var(--panel);border:1px solid var(--line);opacity:.6}
.stack .ghostcard.g2{left:46px;right:46px;bottom:-4px;opacity:.35}
.tcardfront{position:relative;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px 28px;transition:transform .25s ease,opacity .25s ease;animation:pop .25s ease}
.tcardfront.out-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.tcardfront.out-right{transform:translateX(120%) rotate(8deg);opacity:0}
.tcardfront.out-up{transform:translateY(-60%) scale(.9);opacity:0}
.tcardfront .rd-subj{font-size:22px}
.tcardfront .rd-body{font-size:14.5px;max-height:260px;overflow:auto}
.sugg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.sugg>span{font-size:12px;font-weight:700;color:var(--accent);display:flex;gap:5px;align-items:center}
.tr-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.ta{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-weight:650;font-size:12.5px;color:var(--muted)}
.ta:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}
.ta.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.done-screen{text-align:center;padding:60px 20px}
.done-screen .big{font-size:64px;animation:bounce 1s ease}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.stat{padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:100px}
.stat b{display:block;font-size:24px}
.stat small{color:var(--muted);font-weight:600}

/* ---------- Topics ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tcard{position:relative;text-align:left;padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tcard h3{margin:4px 0 12px;font-size:17px;display:flex;gap:8px;align-items:center}
.tc-stats{display:flex;gap:12px;color:var(--muted);font-size:12.5px;font-weight:600}
.tc-stats span{display:flex;gap:4px;align-items:center}
.tc-people{display:flex;margin-top:14px}
.tc-people .av{margin-right:-7px}
.tc-rule{margin-top:12px;font-size:11.5px;color:var(--faint);display:flex;gap:5px;align-items:center}
.tcard.new{border:1.5px dashed var(--line);box-shadow:none;display:flex;flex-direction:column;justify-content:center;gap:10px}
.tcard.new::before{display:none}
.tcard.new input{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);outline:none}
.swatches{display:flex;gap:6px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid transparent}
.sw.on{border-color:var(--text)}
.ws-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ws-head .bigdot{width:18px;height:18px;border-radius:6px;background:var(--c);cursor:pointer}
.ws-head h1[contenteditable]{outline:none;border-radius:6px;padding:0 4px}
.ws-head h1[contenteditable]:focus{background:var(--panel2)}
.rules{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 20px;font-size:12.5px;color:var(--muted)}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.ws-grid .cards{grid-template-columns:1fr;padding:6px 12px 14px}

/* ---------- Tasks ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;align-items:start}
@media (max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr)}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.col>header{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:13px}
.col>header .grow{flex:1}
.col>header small{color:var(--faint);font-weight:500;font-size:11.5px;display:block}
.task{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);animation:pop .25s ease both}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .th{display:flex;gap:9px;align-items:flex-start}
.task .tt{flex:1;font-weight:600;font-size:13px}
.tick{width:18px;height:18px;border-radius:6px;border:1.8px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.task .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.srcmail{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);width:100%;text-align:left}
.srcmail:hover{color:var(--accent)}
.srcmail span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quickadd{display:flex;gap:8px;margin-bottom:16px}
.quickadd input{flex:1;max-width:520px;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);outline:none}
.quickadd input:focus{border-color:var(--accent)}
.nudge{font-size:11.5px;font-weight:700;color:var(--warn)}

/* ---------- Knowledge ---------- */
.kgrid{columns:3 280px;column-gap:14px}
.kcard{break-inside:avoid;margin-bottom:14px;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .25s ease both}
.kcard .kk{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center}
.kcard .kk .grow{flex:1}
.kcard .kv{font-family:var(--mono);font-size:17px;font-weight:600;margin:8px 0 4px;word-break:break-word}
.kcard h3{margin:8px 0 6px;font-size:15px}
.kcard p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.kcard .kf{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ksearch{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ksearch input{flex:1;max-width:460px;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);outline:none}
.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

/* ---------- Ablage ---------- */
.ablage{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.tree{padding:8px}
.tn{display:flex;gap:8px;align-items:center;width:100%;padding:7px 10px;border-radius:9px;text-align:left;font-weight:550;color:var(--muted)}
.tn:hover{background:var(--hover);color:var(--text)}
.tn.on{background:var(--accent-soft);color:var(--accent)}
.tn .grow{flex:1}
.localinfo{display:flex;gap:16px;align-items:center;padding:14px 16px;margin-bottom:14px}
.localinfo .grow{flex:1}
.localinfo b{display:block}
.files{width:100%;border-collapse:collapse}
.files td{padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.files tr{cursor:pointer}
.files tr:hover td{background:var(--hover)}
.files .fn{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ---------- Palette ---------- */
#palette{position:fixed;inset:0;z-index:75;display:none;background:rgba(10,10,20,.35);backdrop-filter:blur(3px);padding-top:12vh}
#palette.show{display:block}
.pal{width:min(640px,94vw);margin:0 auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .15s ease}
.pal-in{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;outline:none;background:none;font-size:16px}
.pal-res{max-height:56vh;overflow:auto;padding:6px}
.pal-res .pop-title{padding:10px 12px 4px}
.pal-hints{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* ---------- Tray ---------- */
#tray{position:fixed;top:58px;right:16px;width:380px;z-index:50;display:none;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s ease}
#tray.show{display:block}
.tr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tr-h .grow{flex:1}
.tr-sec{padding:10px 8px}
.tr-sec h5{margin:2px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tr-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;width:100%;text-align:left}
.tr-row:hover{background:var(--hover)}
.tr-row .grow{flex:1;min-width:0}
.tr-row .grow b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row .grow small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row .qa{display:none;gap:2px}
.tr-row:hover .qa{display:flex}
.tr-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.tr-f .btn{flex:1;justify-content:center}
.dummy{position:fixed;right:14px;bottom:12px;z-index:15;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:20px;box-shadow:var(--shadow)}
.dummy button{color:var(--muted);text-decoration:underline}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;align-items:center}

/* ---------- Fluss & Bestand ---------- */
.zone{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 4px;display:flex;gap:8px;align-items:center}
.zone b{color:var(--muted)}
.zone .grow{flex:1}
.goal{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;text-transform:none;letter-spacing:0}
.board .panel{position:relative}
.bctl{display:flex;gap:2px;margin-left:auto}
.board.edit .panel{outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}
.addw{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.addw:hover{border-color:var(--accent);color:var(--accent)}
.lv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 16px}
.lv:hover{background:var(--hover)}
.lv .grow{flex:1;min-width:0}
.lv .grow b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .grow small{color:var(--faint);font-size:11px}
.lv .src{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--panel2);border:1px solid var(--line);color:var(--muted);flex:none}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.st.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--text))}
.st.bad{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.lv.flash{animation:flash 1.6s ease}
.cheat{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 16px}
.cheat:hover{background:var(--hover)}
.cheat .grow{flex:1;min-width:0}
.cheat small{display:block;color:var(--muted);font-size:11.5px}
.cheat code{font-family:var(--mono);font-size:13px;font-weight:600}
.exp{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap}
.mc-acts{position:absolute;right:10px;bottom:8px;background:var(--panel);padding-left:6px;border-radius:8px}
.lv .meta{display:flex;gap:8px;align-items:center;margin-top:4px;min-width:0}
.lv .meta small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{display:flex;flex-direction:column;gap:2px;margin:4px 0}
.hist div{display:flex;gap:10px;padding:6px 10px;border-radius:8px;font-size:12.5px}
.hist div:first-child{background:var(--hover);font-weight:650}
.hist span:first-child{color:var(--faint);min-width:52px}
/* ---------- KI ---------- */
.ai-line{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--accent);min-width:0}
.ai-line span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:800;background:var(--accent);color:#fff}
.sc.s1,.sc.s2{background:var(--faint)}
.sc.s3{background:color-mix(in srgb,var(--accent) 60%,var(--faint))}
.ai-off{font-size:11px;color:var(--faint);display:flex;gap:5px;align-items:center}
.ai-band{border-radius:12px;padding:12px 14px;margin-bottom:16px;background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 8%,var(--panel)));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.ai-band .h{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ai-band .h .grow{flex:1}
.ai-band p{margin:6px 0 0;font-size:13.5px}
.ai-band .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.digest{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.digest .grow{flex:1}
.digest b{font-size:13.5px}
.digest ul{margin:6px 0 8px;padding-left:18px;font-size:13px}
.digest li{margin:2px 0}
.digest li button{color:var(--accent);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.pcard{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.pcard.off{opacity:.55}
.pcard h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.pcard h3 .grow{flex:1}
.pmeta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pcode{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;white-space:pre-wrap;color:var(--muted)}
.pfoot{display:flex;gap:8px;margin-top:12px}
.sw-toggle{width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw-toggle.on{background:var(--accent)}
.sw-toggle.on::after{left:18px}
.ai-top{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:16px}
.ai-top .grow{flex:1}
.answer{font-size:14px;line-height:1.6}
.answer sup button{color:var(--accent);font-weight:700}
.subt{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;color:var(--muted)}
.subt .tick{width:15px;height:15px;border-radius:5px}
@keyframes flash{0%,100%{background:transparent}20%{background:color-mix(in srgb,var(--accent) 22%,transparent)}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.3)}50%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <nav class="rail" id="rail"></nav>
  <main>
    <header class="top">
      <button class="search-trigger" data-act="palette"><svg class="i"><use href="#i-search"/></svg><span>Suchen oder Befehl …</span><kbd>Strg K</kbd></button>
      <div class="grow"></div>
      <button class="tbtn" data-act="simMenu"><svg class="i"><use href="#i-spark"/></svg>Simulieren</button>
      <button class="tbtn" id="focusBtn" data-act="focus" title="Fokus-Modus: nur Menschen dürfen stören"><svg class="i"><use href="#i-bell"/></svg>Fokus</button>
      <button class="tbtn" data-act="tray" title="So sieht Maillet im System-Tray aus"><svg class="i"><use href="#i-tray"/></svg>Tray-Popup</button>
      <button class="tbtn" data-act="theme" title="Hell / Dunkel"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="tbtn" data-act="keys" title="Tastenkürzel"><svg class="i"><use href="#i-kbd"/></svg></button>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="scrim" data-act="closeReader"></div>
<aside id="reader"></aside>
<div id="dock"></div>
<div id="pop"></div>
<div id="modal"></div>
<div id="palette"></div>
<div id="tray"></div>
<div id="selbubble"><button data-act="selKnow"><svg class="i sm"><use href="#i-bulb"/></svg>Merken</button><button data-act="selTask"><svg class="i sm"><use href="#i-task"/></svg>Aufgabe</button></div>
<div id="toasts"></div>
<div id="notify"></div>
<div class="dummy">Click-Dummy · alle Daten fiktiv · <button data-act="reset">Zurücksetzen</button></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v12h16V8M10 12h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

    const r = D.rules.find(r => m.addr.endsWith(r.match));
    if (r) { m.topic = r.topic; m.auto = true; }
  }
}
function suggestTopic(m) {
  if (m.topic) return null;
  const s = m.subject.toLowerCase();
  const kw = [['atlas', 't1'], ['nordwind', 't2'], ['urlaub', 't3'], ['personal', 't3'], ['reise', 't4'], ['bahn', 't4'], ['rechnung', 't5']];
  for (const [k, t] of kw) if (s.includes(k) && topic(t)) return { t: topic(t), why: `„${k}“ im Betreff` };
  const same = D.mails.find(x => x !== m && x.addr === m.addr && x.topic);
  if (same) return { t: topic(same.topic), why: `${m.from} ist schon dort` };
  return null;
}
function finds(m) {
  const out = [], b = m.body, seen = new Set();
  const push = (kind, label, value) => { if (!seen.has(value)) { seen.add(value); out.push({ kind, label, value }); } };
  for (const x of b.matchAll(/bis (Montag|Dienstag|Mittwoch|Donnerstag|Freitag|morgen|heute)/gi)) push('deadline', 'Frist', x[0]);
  for (const x of b.matchAll(/^([A-ZÄÖÜ][\wäöüß .-]{2,22}):\s*(.+)$/gm)) if (!/^(Hallo|Hi|Hey)/.test(x[1])) push('fact', x[1].trim(), x[2].trim());
  for (const x of b.matchAll(/\+49[\d \/-]{6,}\d/g)) push('phone', 'Telefon', x[0]);
  for (const x of b.matchAll(/https?:\/\/[^\s)]+/g)) push('link', 'Link', x[0]);
  for (const x of b.matchAll(/\b\d{1,2}\.\d{1,2}\.\d{4}\b/g)) push('date', 'Datum', x[0]);
  return out.slice(0, 7);
}
function guessDue(text) {
  const t = text.toLowerCase();
  if (t.includes('heute')) return 'heute';
  if (t.includes('morgen')) return 'morgen';
  if (t.includes('freitag')) return 'fr';
  if (/\d{1,2}\.\d{1,2}\./.test(t)) return 'nw';
  return '';
}

/* ---------- Triage ---------- */
function startTriage() {
  const u = unread().filter(m => S.tfilter === 'alle' || m.group === S.tfilter);
  S.tq = u.map(m => m.id); S.ti = 0; S.tstats = { archived: 0, tasks: 0, pinned: 0, know: 0, ablage: 0, snoozed: 0, skipped: 0, t0: Date.now() };
}
function triageCurrent() {
  while (S.ti < S.tq.length) { const m = mail(S.tq[S.ti]); if (m && !m.archived && !m.snoozed && m.acc !== 'lokal') return m; S.ti++; }
  return null;
}
function vTriage() {
  if (!S.tstats) startTriage();
  const m = triageCurrent(), total = S.tq.length;
  const fseg = ['alle', 'mensch', 'maschine', 'rauschen'].map(k => `<button class="chip ${S.tfilter === k ? 'on' : ''}" data-act="tfilter" data-f="${k}">${k === 'alle' ? 'Alle' : GROUPS[k]}</button>`).join('');

      <div class="stats">${[['archived', 'erledigt'], ['tasks', 'zu Aufgaben'], ['know', 'gemerkt'], ['pinned', 'angepinnt'], ['ablage', 'abgelegt'], ['snoozed', 'auf später']].filter(([k]) => st[k]).map(([k, l]) => `<div class="stat"><b>${st[k]}</b><small>${l}</small></div>`).join('')}</div>
      <button class="btn" data-act="view" data-view="home">${ic('home')}Zur Übersicht</button></div></div>`;

        ${aiBand(m, true)}

/* ---------- Aktionen ---------- */
function act(label, fn, undo = true) {
  const snap = structuredClone(D);
  const res = fn();
  render();
  if (res === false) return;
  toast(label, undo ? [{ label: 'Rückgängig', run: () => { D = snap; render(); toast('Rückgängig gemacht'); } }] : []);
}
function doPin(id) { const m = mail(id); act(m.pinned ? 'Gelöst' : 'Angepinnt – bleibt in der Übersicht griffbereit', () => { m.pinned = !m.pinned; m.unread = false; }); }
function doArchive(id) {
  const m = mail(id);
  act('Erledigt – liegt im Archiv des Servers', () => { m.archived = true; m.unread = false; if (S.open === id) S.open = null; });
}
function assignTopic(id, tid) {
  const m = mail(id), t = topic(tid);
  const snap = structuredClone(D);
  m.topic = tid || null; m.auto = false;
  render();
  const d = domain(m.addr);
  const others = D.mails.filter(x => x !== m && x.addr.endsWith(d) && x.topic !== tid && x.acc !== 'lokal').length;
  const btns = [{ label: 'Rückgängig', run: () => { D = snap; render(); } }];
  if (t && !GENERIC.includes(d) && !D.rules.some(r => r.match === d)) {
    btns.unshift({ label: `Immer: ${d} → ${t.name}`, run: () => { D.rules.push({ id: uid('r'), topic: tid, match: d }); applyRules(); render(); toast(`Regel angelegt${others ? ` · ${others} weitere Mail(s) zugeordnet` : ''}`); } });
  }
  toast(t ? `→ ${t.name}` : 'Thema entfernt', btns);
}
function createTopic(name, color) {
  const t = { id: uid('t'), name: name.trim(), color: color || COLORS[D.topics.length % COLORS.length] };
  D.topics.push(t); return t;
}
const SNOOZE = [['Heute 16:00', 'clock'], ['Morgen 9:00', 'clock'], ['Montag 9:00', 'clock'], ['Wenn keine Antwort kommt (3 Tage)', 'reply'], ['Wenn ich im Büro bin', 'home']];
function doSnooze(id, label) {

  act(`Kommt wieder: ${label}`, () => { m.snoozed = label; m.unread = false; if (S.open === id) S.open = null; });

/* ---------- Popover ---------- */
function openPop(anchor, html, onMount) {
  const p = $('#pop'); p.innerHTML = html; p.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const w = 320;
  let left = Math.min(r.left, innerWidth - w - 12), top = r.bottom + 6;
  if (top + 340 > innerHeight) top = Math.max(12, r.top - 346);
  p.style.left = Math.max(12, left) + 'px'; p.style.top = top + 'px';
  onMount && onMount(p);
}
function closePop() { $('#pop').style.display = 'none'; S.popCtx = null; }

function topicPicker(anchor, id) {
  S.popCtx = { kind: 'topic', id, q: '', idx: 0 };
  const draw = () => {
    const c = S.popCtx, q = c.q.trim().toLowerCase(), m = mail(id);
    const list = D.topics.filter(t => !q || t.name.toLowerCase().includes(q));
    const exact = D.topics.some(t => t.name.toLowerCase() === q);
    const items = list.map((t, i) => `<button class="pi ${i === c.idx ? 'sel' : ''}" data-act="pickT" data-t="${t.id}"><span class="dot" style="--c:${t.color}"></span><span class="grow">${esc(t.name)}</span>${m.topic === t.id ? ic('check', 'sm') : i < 9 ? `<kbd>${i + 1}</kbd>` : ''}</button>`).join('');
    $('#pop .pl').innerHTML = items + (q && !exact ? `<button class="pi ${list.length === 0 ? 'sel' : ''}" data-act="pickNew">${ic('plus', 'sm')}<span class="grow">„${esc(c.q.trim())}“ als neues Thema</span><kbd>↵</kbd></button>` : '')
      + (m.topic ? `<button class="pi" data-act="pickT" data-t=""><span class="faint">${ic('x', 'sm')}</span><span class="grow muted">Thema entfernen</span></button>` : '');
  };
  const sug = suggestTopic(mail(id));
  openPop(anchor, `<input id="tpq" placeholder="Thema suchen oder neu anlegen …" autocomplete="off">${sug ? `<div class="pop-title">${ic('spark', 'sm')} Vorschlag: ${esc(sug.t.name)} <span class="faint">(${esc(sug.why)})</span></div>` : ''}<div class="pl"></div><div class="pop-hint">Ziffer wählt · Enter legt neu an · Ziehen auf ein Thema geht auch</div>`, p => {
    const inp = p.querySelector('#tpq'); inp.focus();
    inp.addEventListener('input', () => { S.popCtx.q = inp.value; S.popCtx.idx = 0; draw(); });
    inp.addEventListener('keydown', e => {
      const q = inp.value.trim().toLowerCase(), list = D.topics.filter(t => !q || t.name.toLowerCase().includes(q));
      if (/^[1-9]$/.test(e.key) && !inp.value) { const t = list[+e.key - 1]; if (t) { e.preventDefault(); closePop(); assignTopic(id, t.id); } }
      else if (e.key === 'ArrowDown') { S.popCtx.idx = Math.min(S.popCtx.idx + 1, list.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { S.popCtx.idx = Math.max(S.popCtx.idx - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (list.length && !(list.length === 0)) { const exact = list.find(t => t.name.toLowerCase() === q); const t = exact || list[S.popCtx.idx]; if (t && (exact || q === '' || list.length)) { closePop(); assignTopic(id, t.id); return; } }
        if (q) { const t = createTopic(inp.value); closePop(); assignTopic(id, t.id); }
      } else if (e.key === 'Escape') closePop();
    });
    draw();
  });
}

  ['Triage starten', 'zap', () => go('triage')], ['Übersicht', 'home', () => go('home')], ['Aufgaben', 'task', () => go('tasks')], ['Wissen', 'bulb', () => go('know')],
  ['Ablage', 'box', () => go('ablage')], ['Themen', 'hash', () => go('topics')], ['KI-Assistenz & Prompts', 'spark', () => go('ai')], ['Neue Notiz', 'plus', () => knowDialog(null)], ['Neue Aufgabe', 'plus', () => taskDialog(null)],
  ['Fokus-Modus umschalten', 'belloff', () => toggleFocus()], ['Hell / Dunkel', 'moon', () => toggleTheme()], ['Tray-Popup zeigen', 'tray', () => toggleTray(true)], ['Tastenkürzel', 'kbd', () => keysDialog()],
];
function palResults() {
  const q = S.pal.q.trim().toLowerCase();
  const res = [];
  const raw = S.pal.q.trim();
  if (D.ai.on && raw.length > 3 && (raw.endsWith('?') || raw.startsWith('?'))) res.push(['✦ KI fragen', [{ icon: 'spark', title: raw.replace(/^\?\s*/, ''), sub: 'Antwort aus Mails, Ablage und Wissen – mit Quellen', run: () => askAI(raw.replace(/^\?\s*/, '')) }]]);
  const cmds = COMMANDS.filter(c => !q || c[0].toLowerCase().includes(q)).slice(0, q ? 4 : 6);
  if (cmds.length) res.push(['Befehle', cmds.map(c => ({ icon: c[1], title: c[0], run: c[2] }))]);
  if (q) {
    let mq = q, from = null, tp = null;
    const fm = q.match(/von:(\S+)/); if (fm) { from = fm[1]; mq = mq.replace(fm[0], '').trim(); }
    const tm = q.match(/thema:(\S+)/); if (tm) { tp = tm[1]; mq = mq.replace(tm[0], '').trim(); }
    const ms = D.mails.filter(m => (!from || (m.from + m.addr).toLowerCase().includes(from)) && (!tp || (topic(m.topic)?.name || '').toLowerCase().includes(tp))
      && (!mq || (m.subject + ' ' + m.from + ' ' + m.body).toLowerCase().includes(mq))).slice(0, 7);
    if (ms.length) res.push(['Mails', ms.map(m => ({ av: m.from, title: m.subject, sub: `${m.from} · ${m.ablage ? 'Ablage/' + m.ablage : acc(m.acc).name}${m.archived ? ' · archiviert' : ''}`, run: () => openMail(m.id) }))]);
    const ts = D.tasks.filter(t => t.title.toLowerCase().includes(mq || q)).slice(0, 4);
    if (ts.length) res.push(['Aufgaben', ts.map(t => ({ icon: 'task', title: t.title, sub: STATUS[t.status], run: () => go('tasks') }))]);
    const ks = D.know.filter(k => (k.title + ' ' + k.content).toLowerCase().includes(mq || q)).slice(0, 4);
    if (ks.length) res.push(['Wissen', ks.map(k => ({ icon: k.kind === 'fact' ? 'key' : 'bulb', title: k.title, sub: k.content.slice(0, 60), run: () => { S.kq = k.title; go('know'); } }))]);
    const tps = D.topics.filter(t => t.name.toLowerCase().includes(q)).slice(0, 3);
    if (tps.length) res.push(['Themen', tps.map(t => ({ dot: t.color, title: t.name, run: () => { S.topic = t.id; go('topic'); } }))]);
  }
  return res;
}
function renderPalette() {
  const res = palResults(), flat = res.flatMap(r => r[1]);
  S.pal.flat = flat; S.pal.idx = Math.min(S.pal.idx, Math.max(0, flat.length - 1));
  let i = 0;
  $('#palette .pal-res').innerHTML = res.map(([h, items]) => `<div class="pop-title">${h}</div>` + items.map(it => { const n = i++; return `<button class="pi ${n === S.pal.idx ? 'sel' : ''}" data-act="palRun" data-n="${n}">
    ${it.av ? avatar(it.av, 'xs') : it.dot ? `<span class="dot" style="--c:${it.dot}"></span>` : ic(it.icon, 'sm')}<span class="grow">${esc(it.title)}${it.sub ? `<br><small class="faint">${esc(it.sub)}</small>` : ''}</span>${n === S.pal.idx ? '<kbd>↵</kbd>' : ''}</button>`; }).join('')).join('')
    || `<div class="empty">Nichts gefunden für „${esc(S.pal.q)}“.</div>`;
}
function openPalette() {
  S.pal = { q: '', idx: 0 };
  const p = $('#palette');
  p.innerHTML = `<div class="pal"><div class="pal-in">${ic('search')}<input id="palq" placeholder="Mails, Aufgaben, Wissen, Ablage, Befehle …" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-res"></div>
    <div class="pal-hints">Filter: <span class="chip">von:hansen</span><span class="chip">thema:atlas</span> · Frage mit <b>?</b> → KI · durchsucht Posteingang, Archiv <b>und</b> lokale Ablage</div></div>`;
  p.classList.add('show');
  const inp = $('#palq'); inp.focus();
  inp.addEventListener('input', () => { S.pal.q = inp.value; S.pal.idx = 0; renderPalette(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { S.pal.idx = Math.min(S.pal.idx + 1, S.pal.flat.length - 1); renderPalette(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { S.pal.idx = Math.max(0, S.pal.idx - 1); renderPalette(); e.preventDefault(); }
    else if (e.key === 'Enter') { const it = S.pal.flat[S.pal.idx]; if (it) { closePalette(); it.run(); } }
    else if (e.key === 'Escape') closePalette();
  });
  renderPalette();
}
function closePalette() { $('#palette').classList.remove('show'); }

/* ---------- Tray ---------- */

function toggleTray(force) { const t = $('#tray'); const on = force ?? !t.classList.contains('show'); t.classList.toggle('show', on); if (on) renderTray(); }

/* ---------- Toasts & Benachrichtigungen ---------- */
function toast(text, actions = []) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(text)}</span>`;
  actions.forEach(a => { const b = document.createElement('button'); b.textContent = a.label; b.onclick = () => { el.remove(); a.run(); }; el.appendChild(b); });
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(() => el.remove(), actions.length ? 6500 : 3200);
}
function notify(title, body, actions) {
  const el = document.createElement('div'); el.className = 'note';
  el.innerHTML = `<div class="nh"><span class="mini">M</span><span class="grow">Maillet · Desktop-Benachrichtigung</span><span>jetzt</span></div><b>${esc(title)}</b><p>${esc(body)}</p><div class="na"></div>`;
  actions.forEach(a => { const b = document.createElement('button'); b.textContent = a.label; b.onclick = () => { el.remove(); a.run(); }; el.querySelector('.na').appendChild(b); });
  $('#notify').appendChild(el);
  setTimeout(() => el.remove(), 9000);
}
function simulate(kind) {
  if (kind === 'jira') {
    const l = D.live.find(x => x.id === 'l1');
    if (!l) { toast('Zustandskarte wurde entfernt – Zurücksetzen stellt sie wieder her'); return; }
    const st = [['In Arbeit', ''], ['In Review', ''], ['Erledigt', 'ok']];
    const nx = st[Math.min(st.findIndex(x => x[0] === l.state) + 1, st.length - 1)];
    const time = new Date().toTimeString().slice(0, 5);
    const m = { id: uid('m'), acc: 'arbeit', from: 'Jira', addr: 'jira@firma.example', group: 'maschine', archived: true, absorbed: 'l1', time, date: '2026-11-10', subject: `[ATLAS-412] Status: ${nx[0]}`, body: `ATLAS-412 wurde auf „${nx[0]}“ gesetzt.` };
    D.mails.unshift(m); l.state = nx[0]; l.tone = nx[1]; l.time = time; l.hist.unshift([time, `Status: ${nx[0]}`, m.id]);
    S.flash = 'l1'; if (S.view !== 'home') go('home'); else render(); setTimeout(() => { S.flash = null; }, 1700);
    toast(`ATLAS-412 → ${nx[0]} · Zustandskarte aktualisiert, nichts Neues im Fluss`, nx[0] === 'Erledigt' ? [{ label: 'Karte entfernen', run: () => { D.live = D.live.filter(x => x.id !== 'l1'); render(); } }] : []);
    return;
  }
  if (kind === 'otp') {
    const o = { id: uid('o'), service: ['Spotify', 'Claude', 'Lufthansa', 'Microsoft'][Math.floor(Math.random() * 4)], code: String(100000 + Math.floor(Math.random() * 899999)), acc: 'privat', exp: Date.now() + 120000, ttl: 120000 };
    D.otps.push(o); render();
    notify(`${o.service}: ${o.code}`, 'Login-Code erkannt', [{ label: 'Kopieren', run: () => copyOtp(o.id) }]);
    return;
  }
  const tpl = {
    mensch: { from: 'Sara Yilmaz', addr: 'sara.yilmaz@firma.example', group: 'mensch', subject: 'Kurze Frage zur Atlas-Demo morgen', body: `Hi,\n\nkönnen wir die Demo morgen um 10:00 machen statt um 14:00? Bitte gib mir bis heute Bescheid.\n\nRaum: 4.12 (Elbblick)\n\nDanke!\nSara` },
    kunde: { from: 'Ines Iversen', addr: 'i.iversen@nordwind.de', group: 'mensch', subject: 'Freigabe Phase 2', body: `Sehr geehrte Damen und Herren,\n\ndie Geschäftsführung hat Phase 2 freigegeben. Bitte senden Sie uns die Auftragsbestätigung bis Freitag.\n\nBestellnummer: NW-2026-0815\n\nMit freundlichen Grüßen\nInes Iversen` },
    news: { from: 'Produktnews', addr: 'news@saas.example', group: 'rauschen', subject: 'Neu: 12 Funktionen, die Sie lieben werden', body: `Entdecken Sie unsere neuesten Funktionen …\n\nAbbestellen` },
  }[kind];
  const m = { id: uid('m'), acc: 'arbeit', unread: true, time: new Date().toTimeString().slice(0, 5), date: '2026-11-10', ...tpl };
  D.mails.unshift(m); applyRules(); render();
  if (S.focus && m.group !== 'mensch') { toast('Still eingereiht (Fokus-Modus)'); return; }
  if (m.group === 'rauschen') { toast('Neue Mail im Rauschen – ohne Benachrichtigung'); return; }
  notify(m.from + (m.topic ? ` · ${topic(m.topic).name}` : ''), m.subject, [
    { label: 'Öffnen', run: () => openMail(m.id) }, { label: 'Aufgabe', run: () => taskDialog(m.id) }, { label: 'Erledigt', run: () => doArchive(m.id) }]);
}
function copyText(t) { try { navigator.clipboard.writeText(t); } catch (e) { /* file:// ohne Berechtigung */ } }
function copyOtp(id) {
  const o = D.otps.find(x => x.id === id); if (!o) return;
  copyText(o.code);
  act(`Code ${o.code} kopiert · Mail archiviert`, () => { D.otps = D.otps.filter(x => x.id !== id); });
  if ($('#tray').classList.contains('show')) renderTray();

function toggleFocus() { S.focus = !S.focus; $('#focusBtn').classList.toggle('on', S.focus); $('#focusBtn').innerHTML = `${ic(S.focus ? 'belloff' : 'bell')}Fokus`; toast(S.focus ? 'Fokus an – nur Menschen dürfen stören' : 'Fokus aus'); }
function toggleTheme() { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; }
function go(v) { S.view = v; S.open = null; if (v === 'triage') S.tstats = null; closePop(); render(); $('#view').scrollTop = 0; }

/* ---------- Render ---------- */

  renderRail();

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('#pop') && !(el && ['pickTopic', 'snooze', 'simMenu'].includes(el.dataset.act))) closePop();
  if (!e.target.closest('#selbubble')) $('#selbubble').style.display = 'none';
  if (!e.target.closest('#tray') && !(el && ['tray', 'pin', 'archive'].includes(el.dataset.act)) && !e.target.closest('[data-act=tray]')) toggleTray(false);
  if (e.target.id === 'modal') return closeModal();
  if (e.target.id === 'palette') return closePalette();
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  e.stopPropagation();
  switch (a) {
    case 'view': closeModal(); go(el.dataset.view); break;
    case 'open': closePop(); closeModal(); openMail(id); break;
    case 'sortAI': S.sortAI = el.dataset.v === '1'; render(); break;
    case 'boardEdit': S.editBoard = !S.editBoard; render(); break;
    case 'bMove': { const i = +el.dataset.i, j = i + +el.dataset.d; if (j >= 0 && j < S.board.length) { [S.board[i], S.board[j]] = [S.board[j], S.board[i]]; render(); } break; }
    case 'bDel': S.board.splice(+el.dataset.i, 1); render(); break;
    case 'bAdd': { const free = Object.keys(WIDGETS).filter(w => !S.board.includes(w)); openPop(el, `<div class="pop-title">Karte aufs Board</div>${free.map(w => `<button class="pi" data-act="bAddW" data-w="${w}">${ic(WIDGETS[w].i, 'sm')}<span class="grow">${WIDGETS[w].t}</span></button>`).join('') || '<div class="faint" style="padding:8px 10px">Alle Karten sind schon da.</div>'}<div class="pop-hint">Smart-Karten entstehen aus jeder Suche.</div>`); break; }
    case 'bAddW': closePop(); S.board.push(el.dataset.w); render(); break;
    case 'live': livePop(el, id); break;
    case 'liveDel': closePop(); act('Zustandskarte entfernt', () => { D.live = D.live.filter(x => x.id !== id); }); break;
    case 'aiToggle': D.ai.on = !D.ai.on; render(); toast(D.ai.on ? 'KI-Assistenz an' : 'KI-Assistenz aus – keine Mail wird mehr ausgewertet'); break;
    case 'aiModel': D.ai.model = el.dataset.v; render(); toast(el.dataset.v === 'api' ? 'Achtung: Mails verlassen jetzt deinen Rechner' : 'Lokales Modell – nichts verlässt den Rechner'); break;
    case 'promptToggle': { const pr = D.ai.prompts.find(x => x.id === id); pr.on = !pr.on; render(); break; }
    case 'promptTest': promptTest(id); break;
    case 'newPrompt': newPrompt(); break;
    case 'savePrompt': { const n = $('#pName').value.trim(), t = $('#pText').value.trim(); if (!n || !t) break; const c = S.mctx; D.ai.prompts.push({ id: uid('p'), on: true, name: n, text: t, scope: c.scope, trigger: c.trigger, out: c.out }); closeModal(); render(); toast(`Prompt „${n}“ angelegt`); break; }
    case 'aiWhy': aiWhy(id, el.dataset.p); break;
    case 'aiTask': { const a = mail(id).ai; taskDialog(id, { title: a.task, subtasks: a.subtasks, due: '' }); break; }
    case 'askEx': closeModal(); askAI(el.dataset.q); break;
    case 'askKnow': closeModal(); knowDialog(null, { kind: 'note', title: el.dataset.q, content: el.dataset.a }); break;
    case 'subTick': { const t = D.tasks.find(x => x.id === id); const st = t.subtasks[+el.dataset.j]; st.done = !st.done; if (t.subtasks.every(x => x.done) && t.status !== 'done') { t.status = 'done'; toast('Alle Teilaufgaben erledigt – Aufgabe abgeschlossen ✓'); } render(); break; }
    case 'favKnow': { const k = D.know.find(x => x.id === id); k.fav = !k.fav; render(); toast(k.fav ? 'Auf dem Spickzettel (Board)' : 'Vom Spickzettel genommen'); break; }
    case 'unblock': { const b = D.ai.block.splice(+el.dataset.i, 1)[0]; render(); toast(`${b.label} ist für die KI freigegeben`); break; }
    case 'addBlock': { const opts = D.topics.map(t => ({ kind: 'topic', id: t.id, label: 'Thema ' + t.name })).concat(D.accounts.map(a => ({ kind: 'acc', id: a.id, label: 'Konto ' + a.name }))).filter(o => !D.ai.block.some(b => b.kind === o.kind && b.id === o.id));
      S.popCtx = { kind: 'block', opts }; openPop(el, `<div class="pop-title">Für die KI sperren</div>${opts.map((o, i) => `<button class="pi" data-act="addBlockW" data-i="${i}"><span class="grow">${esc(o.label)}</span></button>`).join('')}`); break; }
    case 'addBlockW': { const o = S.popCtx.opts[+el.dataset.i]; closePop(); D.ai.block.push(o); render(); toast(`${o.label} gesperrt`); break; }

    case 'task': taskDialog(id); break;
    case 'know': knowDialog(id || null); break;

    case 'copyKnow': { const k = D.know.find(x => x.id === id); copyText(k.content); toast(`Kopiert: ${k.content}`); break; }

    case 'newFolder': { const n = prompt('Neuer Ordner (Pfad mit / möglich)', S.folder + '/'); if (n) { D.folders.push(n.replace(/\/+$/, '')); D.folders.sort(); S.folder = n.replace(/\/+$/, ''); render(); } break; }
    case 'palette': openPalette(); break;
    case 'palRun': { const it = S.pal.flat[+el.dataset.n]; closePalette(); it && it.run(); break; }
    case 'simMenu': simMenu(el); break;
    case 'sim': closePop(); simulate(el.dataset.k); break;
    case 'focus': toggleFocus(); break;
    case 'tray': toggleTray(); break;
    case 'trayOpen': toggleTray(false); openMail(id); break;
    case 'trayTriage': toggleTray(false); go('triage'); break;
    case 'theme': toggleTheme(); break;
    case 'keys': keysDialog(); break;
    case 'settings': settingsDialog(); break;
    case 'reset': D = seed(); applyRules(); Object.assign(S, { view: 'home', open: null, filter: 'alle', tstats: null, sortAI: false, editBoard: false, board: ['pinned', 'live', 'today', 'cheat', 'topics'] }); render(); toast('Dummy zurückgesetzt'); break;
    case 'tArchive': { const m = triageCurrent(); m.archived = true; m.unread = false; triageAdvance('left', 'archived'); break; }
    case 'tPin': { const m = triageCurrent(); m.pinned = true; m.unread = false; triageAdvance('up', 'pinned'); break; }
    case 'tSkip': { const m = triageCurrent(); m.unread = false; triageAdvance('right', 'skipped'); break; }
    case 'tTask': taskDialog(triageCurrent().id); break;
    case 'selKnow': $('#selbubble').style.display = 'none'; knowDialog(S.open, { content: S.sel }); break;
    case 'selTask': $('#selbubble').style.display = 'none'; taskDialog(S.open, { title: S.sel.slice(0, 80), due: guessDue(S.sel) }); break;
  }
});

function saveTask() {
  const c = S.mctx, title = $('#dTitle').value.trim(); if (!title) return;
  const m = mail(c.id), arch = $('#dArch')?.checked;
  closeModal();
  const inTriage = S.view === 'triage' && m && triageCurrent() === m;
  act(`Aufgabe angelegt${arch ? ' · Mail erledigt' : ''}`, () => {
    D.tasks.unshift({ id: uid('k'), title, mail: c.id, due: c.due || '', status: c.status, topic: m ? m.topic : null, since: 0, waitFor: '', subtasks: c.subtasks ? c.subtasks.map(x => ({ t: x, done: false })) : null });
    if (m && arch) { m.archived = true; m.unread = false; if (S.open === m.id) S.open = null; }
  });
  if (inTriage) { if (arch) triageAdvance('up', 'tasks'); else S.tstats.tasks++; }
}
function saveKnow() {
  const c = S.mctx, title = $('#kTitle').value.trim(), content = $('#kContent').value.trim(); if (!title && !content) return;
  const tags = $('#kTags').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
  closeModal();
  if (S.view === 'triage' && S.tstats) S.tstats.know++;
  act('Gemerkt – zu finden unter Wissen und in der Suche', () => { D.know.unshift({ id: uid('w'), kind: c.k, title: title || content.slice(0, 40), content, tags, topic: c.topic, mail: c.id }); });
}
function saveAblage() {
  const c = S.mctx, m = mail(c.id);
  closeModal();
  const inTriage = S.view === 'triage' && triageCurrent() === m;
  act(`Abgelegt in ${c.folder} · offline verfügbar`, () => { m.ablage = c.folder; m.unread = false; if (c.mode === 'move' && m.acc !== 'lokal') { m.archived = true; if (S.open === m.id && S.view !== 'ablage') S.open = null; } });
  if (inTriage && c.mode === 'move') triageAdvance('up', 'ablage'); else if (inTriage) S.tstats.ablage++;
}
function newFolderInDlg() {
  const n = $('#nf').value.trim(); if (!n) return;
  const f = S.mctx.folder + '/' + n.replace(/\//g, '-');
  if (!D.folders.includes(f)) { D.folders.push(f); D.folders.sort(); }
  S.mctx.folder = f; $('#nf').value = ''; S.mctx.draw();
}

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (typing) {
    if (e.key === 'Enter' && e.target.dataset.enter) {
      e.preventDefault();
      const f = e.target.dataset.enter;
      if (f === 'saveTask') saveTask();
      else if (f === 'quickTask') { const v = e.target.value.trim(); if (v) { act('Aufgabe angelegt', () => { D.tasks.unshift({ id: uid('k'), title: v.replace(/ bis \w+$/i, ''), mail: null, due: guessDue(v), status: 'open', topic: null }); }); } }
      else if (f === 'createTopicInline') { const v = e.target.value.trim(); if (v) { createTopic(v, COLORS[S.newColor ?? 5]); render(); toast(`Thema „${v}“ angelegt`); } }
      else if (f === 'newFolderInDlg') newFolderInDlg();
    }
    if (e.key === 'Enter' && e.target.dataset.rename) { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape') { e.target.blur(); if ($('#modal').classList.contains('show')) closeModal(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('#modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && S.mctx?.kind === 'ablage') saveAblage(); return; }
  if ($('#pop').style.display === 'block' && e.key === 'Escape') return closePop();
  if (S.g) { S.g = false; const map = { ü: 'home', u: 'home', h: 'home', t: 'topics', a: 'tasks', w: 'know', l: 'ablage', r: 'triage', k: 'ai', i: 'ai' }; if (map[e.key]) go(map[e.key]); return; }
  if (e.key === 'g') { S.g = true; setTimeout(() => S.g = false, 1200); return; }
  if (e.key === '/') { e.preventDefault(); return openPalette(); }
  if (e.key === '?') return keysDialog();
  if (e.key === 'Escape') { if (S.open) { S.open = null; render(); } else if ($('#tray').classList.contains('show')) toggleTray(false); else if (S.view === 'topic') go('topics'); else if (S.view !== 'home') go('home'); return; }
  const target = S.open ? mail(S.open) : S.view === 'triage' ? triageCurrent() : null;
  if (!target) return;
  const k = e.key.toLowerCase();
  const anchor = document.querySelector('#reader.show [data-act=pickTopic]') || document.querySelector('[data-act=pickTopic]') || $('#view');
  if (S.view === 'triage' && !S.open) {
    if (k === 'e') return el('tArchive'); if (k === 'p') return el('tPin'); if (e.key === 'ArrowRight') return el('tSkip'); if (k === 'a') return taskDialog(target.id);
    if (e.key === 'Enter') return openMail(target.id);
  } else {
    if (k === 'e') return doArchive(target.id); if (k === 'p') return doPin(target.id); if (k === 'a') return taskDialog(target.id);
  }
  if (k === 't') return topicPicker(anchor, target.id);
  if (k === 'm') return knowDialog(target.id);
  if (k === 'l') return ablageDialog(target.id);
  if (k === 's') return snoozePicker(document.querySelector('[data-act=snooze]') || anchor, target.id);
  function el(a) { document.querySelector(`[data-act=${a}]`)?.click(); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.input === 'kq') { S.kq = e.target.value; render(); }
});
document.addEventListener('focusout', e => {
  const id = e.target.dataset && e.target.dataset.rename;
  if (id) { const t = topic(id), v = e.target.textContent.trim(); if (t && v && v !== t.name) { t.name = v; render(); toast('Thema umbenannt'); } }
});

/* Text markieren im Reader → Bubble */
document.addEventListener('mouseup', e => {
  if (!e.target.closest('#rdbody')) return;
  setTimeout(() => {
    const s = getSelection(), txt = s.toString().trim();
    const b = $('#selbubble');
    if (txt.length < 3) { b.style.display = 'none'; return; }
    const r = s.getRangeAt(0).getBoundingClientRect();
    S.sel = txt; b.style.display = 'flex'; b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = r.top + 'px';
  }, 10);
});

/* Drag & Drop: Mails auf Ziele, Aufgaben zwischen Spalten */
document.addEventListener('dragstart', e => {
  const t = e.target.closest && e.target.closest('[data-task]');
  if (t) { S.dragTask = t.dataset.task; e.dataTransfer.setData('text/plain', S.dragTask); t.classList.add('dragging'); return; }
  const c = e.target.closest && e.target.closest('[data-mail]');
  if (!c) return;
  S.drag = c.dataset.mail; e.dataTransfer.setData('text/plain', S.drag); e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging'); closePop(); showDock();
});
document.addEventListener('dragend', () => { hideDock(); document.querySelectorAll('.dragging,.drop-over').forEach(x => x.classList.remove('dragging', 'drop-over')); setTimeout(() => { S.drag = null; S.dragTask = null; }, 0); });
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z) return;
  const isCol = z.dataset.drop.startsWith('col:');
  if ((isCol && !S.dragTask) || (!isCol && !S.drag)) return;
  e.preventDefault();
  document.querySelectorAll('.drop-over').forEach(x => x !== z && x.classList.remove('drop-over'));
  z.classList.add('drop-over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault();
  const d = z.dataset.drop;
  if (d.startsWith('col:') && S.dragTask) { const t = D.tasks.find(x => x.id === S.dragTask), st = d.slice(4); if (t && t.status !== st) act(`→ ${STATUS[st]}`, () => { t.status = st; if (st === 'wait') t.since = 0; }); return; }
  const id = S.drag; if (!id) return;
  hideDock();
  if (d.startsWith('topic:')) assignTopic(id, d.slice(6));
  else if (d === 'pin') doPin(id);
  else if (d === 'archive') doArchive(id);
  else if (d === 'task') taskDialog(id);
  else if (d === 'know') knowDialog(id);
  else if (d === 'ablage') ablageDialog(id);
  else if (d === 'snooze') snoozePicker(z, id);
});

/* OTP-Countdown */
setInterval(() => {
  let expired = false;
  document.querySelectorAll('.ring[data-exp]').forEach(r => {
    const left = +r.dataset.exp - Date.now();
    if (left <= 0) expired = true;
    r.style.setProperty('--p', Math.max(0, left / +r.dataset.ttl));
  });
  if (expired) { D.otps = D.otps.filter(o => o.exp > Date.now()); render(); }
}, 500);

render();
setTimeout(() => notify('Jana Wolff', 'Atlas: Review der Spezifikation bis Freitag', [
  { label: 'Öffnen', run: () => openMail('m1') }, { label: 'Aufgabe', run: () => taskDialog('m1') }, { label: 'Später', run: () => doSnooze('m1', 'Morgen 9:00') }]), 1200);
</script>
</body>
</html>
