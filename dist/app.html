<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maillet</title>
<style>
:root{
  --bg:#f4f4f7; --panel:#fff; --panel2:#f9f9fb; --hover:#f1f1f6; --text:#17171f; --muted:#6c6c7e; --faint:#a0a0b2;
  --line:#e6e6ee; --accent:#6d5dfc; --accent-soft:#efedff; --accent-2:#22c3b5; --ok:#12b07f; --warn:#f2a20c; --danger:#e5484d;
  --shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px rgba(20,20,40,.06); --shadow-lg:0 20px 60px rgba(20,20,40,.18);
  --font:"Inter","Cantarell","Noto Sans","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
  --railw:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e0f14; --panel:#171821; --panel2:#1c1e28; --hover:#22242f; --text:#ececf4; --muted:#9a9bb2; --faint:#62647a;
  --line:#272938; --accent:#8b7dff; --accent-soft:#25223f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 24px 70px rgba(0,0,0,.55);
}}
:root[data-theme=dark]{
  --bg:#0e0f14; --panel:#171821; --panel2:#1c1e28; --hover:#22242f; --text:#ececf4; --muted:#9a9bb2; --faint:#62647a;
  --line:#272938; --accent:#8b7dff; --accent-soft:#25223f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
#app{position:relative;display:grid;grid-template-columns:var(--railw) 1fr;height:100vh;container:win/inline-size}

/* Navigation */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.logo{width:38px;height:38px;margin-bottom:10px}
.nav{position:relative;width:44px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{position:absolute;top:1px;right:0}
.nav[hidden]{display:none}
.i.filled{fill:currentColor}
.ib.on{color:var(--warn)}
.pin-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.pin-row:hover{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.pin-row .grow{flex:1;min-width:0}
.pin-row b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-row small{color:var(--muted);font-size:11.5px}
.pin-row .star{color:var(--warn)}
.task-acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container win (min-width:760px){.board{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.tcol{--sc:var(--accent)}
.tcol.st-progress,.st-progress{--sc:var(--warn)}
.tcol.st-done,.st-done{--sc:var(--ok)}
.st-open{--sc:var(--accent)}
.tcol-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.tcol-head .link{text-transform:none;letter-spacing:0}
.tcol-head .grow{flex:1}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.tcard::before{background:var(--sc)!important}
.tcard.st-done .mc-subj{text-decoration:line-through;color:var(--muted)}
.tcard.st-done{opacity:.8}
.col-empty{padding:14px;text-align:center;font-size:12px;color:var(--faint);border:1px dashed var(--line);border-radius:12px}
.st-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.ab.sm{padding:5px 9px;font-size:12px}
.spacer{flex:1}
.badge[hidden]{display:none}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}

/* Kopf */
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.top .grow{flex:1;align-self:stretch}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.sm{width:28px;height:28px;border-radius:8px}
.spin svg{animation:spin .8s linear infinite}
#statusBtn{position:relative}
#statusBtn.warn{color:var(--danger)}
#statusBtn .sdot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--warn);animation:blink 1.2s ease infinite}
#statusPop{position:absolute;top:54px;right:10px;width:min(340px,calc(100% - var(--railw) - 20px));max-height:calc(100% - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:30;padding:12px;display:none;animation:pop .15s ease}
#statusPop.show{display:block}
.sp-head{display:flex;gap:10px;align-items:center;padding:0 2px 10px;border-bottom:1px solid var(--line)}
.sp-head img{width:34px;height:34px}
.sp-head small{color:var(--muted)}
.sp-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 4px}
.sp-row{display:flex;gap:10px;align-items:flex-start;padding:6px 4px}
.sp-row .dot{margin-top:6px}
.sp-row .grow{flex:1;min-width:0}
.sp-row b{font-size:13px}
.sp-row small{display:block;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.sp-row .msg.error{color:var(--danger)}
.sw{width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;margin-top:2px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:18px}
.sp-foot{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sp-foot .btn{flex:1;justify-content:center;padding:7px 10px}
#view{flex:1;overflow:auto;padding:16px 14px 40px}

/* Übersicht */
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.hero{margin-bottom:14px}
.hero p{margin:3px 0 0;color:var(--muted)}
.hero b{color:var(--text)}
.zone{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px;display:flex;align-items:center;gap:7px}
.zone .grow{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.codes{display:flex;flex-direction:column;gap:8px}
.otp{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;text-align:left;background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 18%,transparent);animation:pop .3s ease}
.otp small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.otp .code{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.otp .link{font-weight:700;color:var(--accent)}
.otp .grow{flex:1;min-width:0}
.ring{--p:1;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:19px;height:19px;border-radius:50%;background:var(--panel)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.mcard{position:relative;display:flex;flex-direction:column;gap:5px;padding:11px 12px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s,transform .15s}
.mcard.fresh{animation:pop .25s ease both}
.mcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.mcard::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent)}
.mcard.bulk{opacity:.72}
.mcard.bulk::before{background:var(--faint)}
.mc-head{display:flex;gap:10px;align-items:center}
.mc-from{flex:1;min-width:0;line-height:1.25}
.mc-from b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-from small{color:var(--muted);font-size:11.5px}
.mc-subj{font-weight:650;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.mc-prev{color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mc-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.code{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-family:var(--mono)}
/* Aktionsleiste als Teil der Karte: ein L aus einem Stück in der Ecke oben rechts.
   Senkrecht am rechten Rand die Standardaktionen (Stern in der Ecke), waagerecht
   nach links die Sonderaktionen. Die Karte hält rechts Platz frei. */
.mcard.has-acts{padding-right:44px;min-height:116px}
.mc-acts{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.mcard:hover .mc-acts,.mcard:focus-within .mc-acts{opacity:1}
.acts-v,.acts-h{position:absolute;top:0;display:flex;align-items:center;background:var(--panel2);pointer-events:auto}
.acts-v{right:0;bottom:0;width:36px;flex-direction:column;padding:4px 0;border-left:1px solid var(--line);border-radius:0 11px 11px 0}
.acts-h{right:35px;height:36px;flex-direction:row-reverse;padding:0 3px 0 5px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-bottom-left-radius:11px;z-index:1}
.acts-v .ib,.acts-h .ib{width:28px;height:27px}
.av{--h:250;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 45% 35%)}
:root[data-theme=dark] .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}}
.av-wrap{position:relative;display:inline-flex;flex:none}
.av-badge{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.av-badge svg{width:11px;height:11px}
.av-badge.pin{color:var(--warn)}
.av.lg+.av-badge{width:19px;height:19px}
.av.lg+.av-badge svg{width:13px;height:13px}
.av.lg{width:44px;height:44px;font-size:15px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.more{font-size:12px;color:var(--faint);text-align:center;padding:10px}
.status{display:flex;flex-direction:column;gap:4px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:left;width:100%;padding:3px 2px;border-radius:6px}
.st b{color:var(--text);font-weight:600}
.st span.msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.error{color:var(--danger)}
.st.error:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.dot.connecting{background:var(--warn)}
.dot.error{background:var(--danger)}
.dot.listening{background:var(--ok)}
.dot.off{background:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}

/* Mail-Ansicht: deckt das Fenster ab, nur die Navigation bleibt */
#reader{position:absolute;top:0;left:var(--railw);right:0;bottom:0;background:var(--panel);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:10}
#reader.show{transform:none}
.rd-top{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rd-top .grow{flex:1}
.rd-scroll{flex:1;overflow:auto;padding:16px 16px 40px;user-select:text}
.rd-inner{max-width:780px;margin:0 auto}
.rd-head{display:flex;gap:12px;align-items:center}
.rd-head .grow{flex:1;min-width:0}
.rd-head small{color:var(--muted);overflow-wrap:anywhere}
.rd-subj{font-size:18px;letter-spacing:-.01em;margin:14px 0 10px;line-height:1.3;overflow-wrap:anywhere}
.rd-actions{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ab{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--panel)}
.ab:hover{color:var(--text);border-color:var(--faint)}
.ab.main{background:var(--accent);border-color:var(--accent);color:#fff}
.view-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg2{display:inline-flex;padding:2px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.seg2 button{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.img-note{font-size:12px;color:var(--muted);line-height:1.6}
.img-note svg{vertical-align:-3px;margin-right:4px}
.img-note .link{font-size:12px}
.html-wrap{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
#mailframe{display:block;width:100%;height:160px;border:0;background:#fff}
.rd-body{white-space:pre-wrap;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.att-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.att{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600}
.loading{color:var(--muted);padding:20px 0}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--hover),var(--panel2),var(--hover));background-size:200% 100%;animation:shimmer 1.2s infinite;margin:10px 0}

/* Meldungen */
#toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none;width:calc(100% - 24px)}
.toast{pointer-events:auto;max-width:100%;padding:9px 14px;border-radius:12px;background:var(--text);color:var(--panel);box-shadow:var(--shadow-lg);font-weight:550;font-size:12.5px;animation:up .25s ease}
.toast.err{background:var(--danger);color:#fff}
.toast{display:flex;align-items:center;gap:10px}
.toast button{padding:4px 9px;border-radius:7px;font-weight:700;color:var(--accent-2)}
.toast button:hover{background:rgba(127,127,127,.25)}
.noise-head{margin-top:18px}
.link{color:var(--accent);font-weight:700;font-size:12px;text-transform:none;letter-spacing:0}
.link:hover{text-decoration:underline}

/* Breitere Fenster (von Hand aufgezogen) */
@container win (min-width:640px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  #view{padding:20px 22px 40px}
}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(3px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.3}}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app">
  <nav class="rail">
    <img class="logo" src="icon.png" alt="Maillet" title="Maillet">
    <button class="nav on" id="navHome" data-act="home" data-t-title="app.overview"><svg class="i"><use href="#i-home"/></svg><span class="badge" id="navBadge" hidden></span></button>
    <button class="nav" id="navTasks" data-act="tasks" data-t-title="app.tasks" hidden><svg class="i"><use href="#i-task"/></svg><span class="badge" id="taskBadge" hidden></span></button>
    <div class="spacer"></div>
    <button class="nav" data-act="settings" data-t-title="app.settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </nav>
  <main>
    <header class="top">
      <div class="grow" data-tauri-drag-region></div>
      <button class="ib" id="statusBtn" data-act="status" data-t-title="app.status"><svg class="i"><use href="#i-activity"/></svg></button>
      <button class="ib" id="checkBtn" data-act="check" data-t-title="app.check"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="ib" data-act="theme" data-t-title="app.theme"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="ib" data-act="hide" data-t-title="app.close"><svg class="i"><use href="#i-x"/></svg></button>
    </header>
    <section id="view"></section>
  </main>
  <aside id="reader"></aside>
  <div id="toasts"></div>
  <div id="statusPop"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 21v-5h-5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-8 8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v12h16V8M10 12h4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
  </defs>
</svg>

<script>
'use strict';
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const $ = s => document.querySelector(s);
const ic = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const initials = n => n.replace(/@.*/, '').replace(/[^\p{L}\s.-]/gu, ' ').split(/[\s.-]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
const sender = m => m.from_name || m.from_addr || t('mail.unknown');
const avatar = (m, cls = '') => { const n = sender(m); return `<span class="av ${cls}" style="--h:${hue(n)}">${esc(initials(n))}</span>`; };
const CODE_TTL = 120000;

/* ---- Übersetzungen (dist/i18n/*.json, vom Backend geliefert) ---- */
let T = {};
const t = (key, vars) => { let s = T[key] ?? key; if (vars) for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v); return s; };
const LOCALE = () => T.locale || 'en-GB';
async function loadI18n() {
  try { const r = await invoke('get_i18n'); T = r.strings; document.documentElement.lang = r.language; } catch (e) { /* bleibt bei den Schlüsseln */ }
  document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
}

const S = { data: null, accounts: null, filter: 'all', group: 'all', view: 'home', tasks: null, open: null, content: null, codes: [], loading: true };

function when(ts, long) {
  if (!ts) return '';
  const d = new Date(ts * 1000), now = new Date();
  const time = d.toLocaleTimeString(LOCALE(), { hour: '2-digit', minute: '2-digit' });
  if (long) return d.toLocaleString(LOCALE(), { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (days === 0) return time;
  if (days === 1) return t('date.yesterday');
  if (days < 7) return d.toLocaleDateString(LOCALE(), { weekday: 'short' });
  return d.toLocaleDateString(LOCALE(), { day: '2-digit', month: '2-digit' });
}
function greet() { const h = new Date().getHours(); return t(h < 11 ? 'greet.morning' : h < 18 ? 'greet.day' : 'greet.evening'); }

async function refresh() {
  try {
    const [data, accounts] = await Promise.all([invoke('list_mails'), invoke('get_accounts')]);
    S.data = data; S.accounts = accounts; S.loading = false;
  } catch (e) { toast(String(e), true); }
  render();
}

function render() {
  const d = S.data || { accounts: [], mails: [], status: [] };
  const total = d.accounts.reduce((a, x) => a + x.unread_total, 0);
  const badge = $('#navBadge');
  badge.hidden = !total; badge.textContent = total > 99 ? '99+' : total;
  const tb = $('#taskBadge'), nTasks = S.tasks ? S.tasks.filter(it => it.status !== 'done').length : 0;
  $('#navTasks').hidden = !(S.tasks && S.tasks.length) && S.view !== 'tasks';
  tb.hidden = !nTasks; tb.textContent = nTasks;
  $('#navHome').classList.toggle('on', S.view === 'home');
  $('#navTasks').classList.toggle('on', S.view === 'tasks');
  $('#view').innerHTML = S.accounts && !S.accounts.length ? onboarding() : S.view === 'tasks' ? tasksView() : home(d, total);
  tickCodes();
  scheduleFit();
}

function onboarding() {
  return `<div class="empty"><div class="big">📬</div><h1>${t('onb.title')}</h1>
    <p class="muted">${t('onb.text')}</p>
    <button class="btn primary" data-act="settings">${ic('mail', 'sm')}${t('onb.add')}</button></div>`;
}

function home(d, total) {
  const multi = d.accounts.length > 1;
  const inAccount = d.mails.filter(m => S.filter === 'all' || m.account_id === S.filter);
  const people = inAccount.filter(m => !m.bulk), noise = inAccount.filter(m => m.bulk);
  const shown = d.accounts.reduce((a, x) => a + (S.filter === 'all' || x.account_id === S.filter ? x.unread_total : 0), 0);
  const summary = S.loading || (!d.accounts.length && d.status.some(s => s.state === 'connecting'))
    ? t('home.checking')
    : total ? `${total > 1 ? t('home.summary', { n: total }) : t('home.summary_one')}${noise.length ? t('home.of_noise', { n: noise.length }) : ''}.` : t('home.none');
  const gchip = (k, label, n) => `<button class="chip ${S.group === k ? 'on' : ''}" data-act="group" data-g="${k}">${label}${n === undefined ? '' : ` <span class="faint">${n}</span>`}</button>`;
  const noiseHead = noise.length ? `<div class="zone noise-head">${ic('mute', 'sm')}${t('home.noise')}<span class="faint">${noise.length}</span><span class="grow"></span><button class="link" data-act="archiveNoise" title="${t('home.noise_all_tip')}">${t('home.noise_all')}</button></div>` : '';
  let list;
  if (S.group === 'people') list = `<div class="cards">${people.map(card).join('') || empty(t('home.empty_people'))}</div>`;
  else if (S.group === 'noise') list = noise.length ? `${noiseHead}<div class="cards">${noise.map(card).join('')}</div>` : `<div class="cards">${empty(t('home.empty_noise'))}</div>`;
  else list = `<div class="cards">${people.map(card).join('') || (noise.length ? '' : (S.loading ? skeleton() : empty(t('home.empty'))))}</div>${noiseHead}${noise.length ? `<div class="cards">${noise.map(card).join('')}</div>` : ''}`;
  return `
    <div class="hero"><h1>${greet()}.</h1><p>${summary}</p></div>
    <div id="codes"></div>
    ${(d.pinned || []).length ? `<div class="zone">${ic('star', 'sm')}${t('home.pinned')}<span class="grow"></span><span class="faint">${d.pinned.length}</span></div>${d.pinned.map(pinRow).join('')}` : ''}
    <div class="zone">${ic('mail', 'sm')}${t('home.new')}<span class="grow"></span>${total ? `<span class="faint">${total}</span>` : ''}</div>
    <div class="chips">${gchip('all', t('home.all'))}${gchip('people', t('home.people'), people.length)}${gchip('noise', t('home.noise'), noise.length)}</div>
    ${multi ? `<div class="chips"><button class="chip ${S.filter === 'all' ? 'on' : ''}" data-act="filter" data-f="all">${t('home.all_accounts')}</button>${d.accounts.map(a => `<button class="chip ${S.filter === a.account_id ? 'on' : ''}" data-act="filter" data-f="${esc(a.account_id)}">${esc(a.account)} <span class="faint">${a.unread_total}</span></button>`).join('')}</div>` : ''}
    ${list}
    ${shown > inAccount.length ? `<div class="more">${t('home.more', { shown: inAccount.length, total: shown })}</div>` : ''}
    `;
}
// Besondere Zustände einer Mail als kleines Abzeichen am Absender-Symbol (rechts unten),
// sichtbar ohne Überfahren. Weitere Zustände können hier dazukommen.
function statusAvatar(m, cls = '') {
  const badge = isPinned(m.id) ? `<span class="av-badge pin" title="${t('home.pinned')}">${ic('star', 'filled')}</span>` : '';
  return `<span class="av-wrap">${avatar(m, cls)}${badge}</span>`;
}
const isPinned = id => ((S.data && S.data.pinned) || []).some(p => p.id === id || (p.message_id && S.data.mails.some(m => m.id === id && m.message_id === p.message_id)));
const pinRow = m => `<button class="pin-row" data-act="open" data-id="${esc(m.id)}">${ic('star', 'sm filled star')}<span class="grow"><b>${esc(m.subject || t('mail.no_subject'))}</b><small>${esc(sender(m))} · ${esc(when(m.date))}</small></span></button>`;
/* ---- Aufgaben als Board: Open · In progress · Done (Ordner auf dem Server) ---- */
const TASK_COLS = [['open', 'tasks.col_open'], ['progress', 'tasks.col_progress'], ['done', 'tasks.col_done']];
const taskKey = it => `${it.status}|${it.mail.id}`;
function tasksView() {
  if (!S.tasks) return `<div class="hero"><h1>${t('app.tasks')}</h1><p>${t('tasks.loading')}</p></div>${skeleton()}`;
  const by = st => S.tasks.filter(it => it.status === st);
  return `<div class="hero"><h1>${t('app.tasks')}</h1><p>${t('tasks.summary', { o: by('open').length, p: by('progress').length })}<br><small class="faint">${t('tasks.folder')}</small></p></div>
    <div class="board">${TASK_COLS.map(([k, label]) => {
      const items = by(k);
      return `<section class="tcol st-${k}"><div class="tcol-head"><span class="sdot"></span>${t(label)}<span class="faint">${items.length}</span><span class="grow"></span>${k === 'done' && items.length ? `<button class="link" data-act="archiveDone">${t('tasks.archive_all')}</button>` : ''}</div>
        <div class="cards">${items.map(taskCard).join('') || `<div class="col-empty">${t('tasks.col_empty')}</div>`}</div></section>`;
    }).join('')}</div>`;
}
// Aktionen je Status: [Ziel, Beschriftung, Symbol, Hauptaktion?]
const TASK_ACTIONS = {
  open: [['progress', 'tasks.start', 'play', true], ['done', 'tasks.done', 'check']],
  progress: [['done', 'tasks.done', 'check', true], ['open', 'tasks.to_open', 'back']],
  done: [['open', 'tasks.reopen', 'undo'], ['archive', 'tasks.archive', 'box', true]],
};
const taskButtons = (it, small) => TASK_ACTIONS[it.status].map(([to, label, icon, main]) =>
  `<button class="ab ${main ? 'main' : ''} ${small ? 'sm' : ''}" data-act="taskMove" data-key="${esc(taskKey(it))}" data-to="${to}">${ic(icon, 'sm')}${t(label)}</button>`).join('');
const taskCard = it => { const m = it.mail; return `<div class="mcard tcard st-${it.status} ${fresh(taskKey(it))}" data-act="openTask" data-key="${esc(taskKey(it))}" tabindex="0">
    <div class="mc-head">${avatar(m)}<div class="mc-from"><b>${esc(sender(m))}</b><small>${esc(m.account)} · ${esc(when(m.date))}</small></div></div>
    <div class="mc-subj">${esc(m.subject || t('mail.no_subject'))}</div>
    ${m.preview && it.status !== 'done' ? `<div class="mc-prev">${esc(m.preview)}</div>` : ''}
    <div class="task-acts">${taskButtons(it, true)}</div>
  </div>`; };
const empty = text => `<div class="empty"><div class="big">🌿</div>${esc(text)}</div>`;

const skeleton = () => [1, 2, 3].map(() => `<div class="mcard" style="cursor:default"><div class="skel" style="width:40%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div></div>`).join('');

// Karten nur beim ersten Erscheinen animieren, nicht bei jedem Neuzeichnen.
const seenCards = new Set();
const fresh = id => { if (seenCards.has(id)) return ''; seenCards.add(id); return 'fresh'; };
function card(m) {
  const codes = (m.findings || []).filter(f => f.feature === 'otp');
  return `<div class="mcard has-acts ${m.bulk ? 'bulk' : ''} ${fresh(m.id)}" data-act="open" data-id="${esc(m.id)}" tabindex="0">
    <div class="mc-head">${statusAvatar(m)}<div class="mc-from"><b>${esc(sender(m))}</b><small>${esc(m.account)} · ${esc(when(m.date))}${m.has_attachments ? ' · 📎' : ''}</small></div></div>
    <div class="mc-subj">${esc(m.subject || t('mail.no_subject'))}</div>
    ${m.preview ? `<div class="mc-prev">${esc(m.preview)}</div>` : ''}
    ${codes.length || m.bulk ? `<div class="mc-tags">${codes.map(f => `<span class="tag code">${f.kind === 'link' ? t('mail.login_link') : esc(f.value)}</span>`).join('')}${m.bulk ? `<span class="tag">${t('mail.newsletter')}</span>` : ''}</div>` : ''}
    <div class="mc-acts">
      <div class="acts-v">
        <button class="ib sm ${isPinned(m.id) ? 'on' : ''}" data-act="pin" data-id="${esc(m.id)}" title="${isPinned(m.id) ? t('card.unpin') : t('card.pin')}">${ic('star', isPinned(m.id) ? 'sm filled' : 'sm')}</button>
        <button class="ib sm" data-act="archive" data-id="${esc(m.id)}" title="${t('card.archive')}">${ic('check', 'sm')}</button>
        <button class="ib sm" data-act="read" data-id="${esc(m.id)}" title="${t('card.read')}">${ic('dot', 'sm')}</button>
        ${m.from_addr ? (m.bulk
          ? `<button class="ib sm" data-act="kind" data-addr="${esc(m.from_addr)}" data-bulk="0" title="${t('card.is_person')}">${ic('user', 'sm')}</button>`
          : `<button class="ib sm" data-act="kind" data-addr="${esc(m.from_addr)}" data-bulk="1" title="${t('card.is_noise')}">${ic('mute', 'sm')}</button>`) : ''}
      </div>
      <div class="acts-h">
        <button class="ib sm" data-act="task" data-id="${esc(m.id)}" title="${t('card.task')}">${ic('task', 'sm')}</button>
      </div>
    </div>
  </div>`;
}

/* ---- Fensterhöhe: das Popup ist nur so hoch wie sein Inhalt ---- */
let fitQueued = false, lastFit = 0;
function scheduleFit() {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fitQueued = false;
    let h;
    if (S.open) {
      const top = document.querySelector('.rd-top'), inner = document.querySelector('.rd-inner');
      h = (top ? top.offsetHeight : 0) + (inner ? inner.offsetHeight : 0) + 60;
    } else {
      const kids = [...$('#view').children];
      h = kids.length ? Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + 24 : 300;
    }
    h = Math.ceil(h);
    if (Math.abs(h - lastFit) > 4) { lastFit = h; invoke('fit_main', { height: h }).catch(() => {}); }
  }));
}

/* ---- Status (Kopfzeile) ---- */
async function refreshStatus() {
  try { S.status = await invoke('get_app_status'); } catch (e) { return; }
  renderStatusBtn();
  if ($('#statusPop').classList.contains('show')) renderStatusPop();
}
function problems() {
  const st = S.status;
  if (!st) return { errors: 0, connecting: false };
  return { errors: st.accounts.filter(a => a.state === 'error').length + (st.api.state === 'error' ? 1 : 0) + (st.shortcut && st.shortcut.error ? 1 : 0), connecting: st.accounts.some(a => a.state === 'connecting') };
}
function renderStatusBtn() {
  const b = $('#statusBtn'), p = problems();
  b.classList.toggle('warn', p.errors > 0);
  b.innerHTML = p.errors ? ic('alert') : ic('activity') + (p.connecting ? '<span class="sdot"></span>' : '');
  b.title = p.errors ? (p.errors > 1 ? t('status.problems', { n: p.errors }) : t('status.problems_one')) : t(p.connecting ? 'status.connecting' : 'status.ok');
}
const hhmm = ts => ts ? new Date(ts * 1000).toLocaleTimeString(LOCALE(), { hour: '2-digit', minute: '2-digit' }) : '';
function accountLine(a) {
  if (a.state === 'ok') return `<small>${t('status.connected', { n: a.unread ?? 0 })}${a.timestamp ? t('status.checked', { t: hhmm(a.timestamp) }) : ''}</small>`;
  if (a.state === 'connecting') return `<small>${t('status.connecting_short')}</small>`;
  return `<small class="msg error">${esc(a.message)}</small>${a.timestamp ? `<small>${t('status.since', { t: hhmm(a.timestamp) })}</small>` : ''}`;
}
function renderStatusPop() {
  const st = S.status, pop = $('#statusPop');
  if (!st) { pop.innerHTML = `<div class="loading">${t('status.loading')}</div>`; return; }
  const api = st.api;
  pop.innerHTML = `
    <div class="sp-head"><img src="icon.png" alt=""><div><b>Maillet ${esc(st.version)}</b><br><small>${t('status.tagline')}</small></div></div>
    <div class="sp-title">${t('status.accounts')}</div>
    ${st.accounts.map(a => `<div class="sp-row"><span class="dot ${a.state}"></span><div class="grow"><b>${esc(a.label)}</b> <small style="display:inline">${esc(a.server)} · ${esc(a.mailbox)}</small>${accountLine(a)}</div></div>`).join('') || `<div class="sp-row"><small>${t('status.no_account')}</small></div>`}
    ${api.state !== 'off' ? `<div class="sp-title">${t('status.api')}</div>
      <div class="sp-row"><span class="dot ${api.state}"></span><div class="grow"><b>${api.state === 'listening' ? t('status.api_running') : t('status.api_error')}</b><small class="msg ${api.state === 'error' ? 'error' : ''}">${esc(api.message)}</small>${api.last_request ? `<small>${t('status.last_request', { t: hhmm(api.last_request) })}</small>` : ''}</div></div>` : ''}
    ${shortcutRow(st.shortcut)}
    <div class="sp-foot"><button class="btn" data-act="check">${ic('refresh', 'sm')}${t('app.check')}</button><button class="btn" data-act="settings">${ic('gear', 'sm')}${t('app.settings')}</button></div>`;
}
// Only a broken shortcut shows up here; it is configured in the settings (General).
function shortcutRow(sc) {
  if (!sc || !sc.error) return '';
  return `<div class="sp-title">${t('status.shortcut')}</div><div class="sp-row"><span class="dot error"></span><div class="grow"><b>${esc(sc.keys)}</b><small class="msg error">${t('status.shortcut_na', { e: esc(sc.error) })}</small></div></div>`;
}
function toggleStatus(force) {
  const pop = $('#statusPop'), show = force ?? !pop.classList.contains('show');
  pop.classList.toggle('show', show);
  if (show) { renderStatusPop(); refreshStatus(); }
}

/* ---- Codes (OTP-Funktion) ---- */
function addCode(payload) {
  try {
    const c = typeof payload === 'string' ? JSON.parse(payload) : payload;
    S.codes = S.codes.filter(x => x.code !== c.code);
    S.codes.unshift({ ...c, exp: Date.now() + CODE_TTL });
    render();
  } catch (e) { /* kein gültiger Code */ }
}
function tickCodes() {
  S.codes = S.codes.filter(c => c.exp > Date.now());
  const box = $('#codes');
  if (!box) return;
  box.innerHTML = S.codes.length ? `<div class="zone" style="margin-top:4px">${ic('key', 'sm')}${t('codes.title')}</div><div class="codes">${S.codes.map((c, i) => `
    <button class="otp" data-act="code" data-i="${i}" title="${c.kind === 'link' ? t('codes.open_link') : t('codes.copy_tip')}">
      <span class="ring" data-exp="${c.exp}"></span>
      <span class="grow"><small>${esc(c.rule || '')} · ${esc(c.account || '')}</small>${c.kind === 'link' ? `<span class="link">${t('codes.login_link')}</span>` : `<span class="code">${esc(c.code)}</span>`}</span>
      <span class="faint">${ic('copy')}</span></button>`).join('')}</div>` : '';
}
setInterval(() => {
  let expired = false;
  document.querySelectorAll('.ring[data-exp]').forEach(r => {
    const left = +r.dataset.exp - Date.now();
    if (left <= 0) expired = true;
    r.style.setProperty('--p', Math.max(0, left / CODE_TTL));
  });
  if (expired) { tickCodes(); scheduleFit(); }
}, 500);

/* ---- Mail-Ansicht ---- */
async function openMail(id) {
  const m = S.data.mails.find(x => x.id === id) || (S.data.pinned || []).find(x => x.id === id);
  if (!m) return;
  S.open = m; S.content = null; S.htmlMode = true; S.loadImages = false;
  renderReader();
  try {
    S.content = await invoke('get_mail', { id });
    if (S.open && S.open.id === id) renderReader();
    invoke('set_seen', { id, seen: true }).catch(e => toast(String(e), true));
  } catch (e) {
    S.content = { error: String(e) };
    renderReader();
  }
}
async function openTask(key) {
  const it = (S.tasks || []).find(x => taskKey(x) === key);
  if (!it) return;
  S.open = { ...it.mail, task: true, status: it.status, key }; S.content = null; S.htmlMode = true; S.loadImages = false;
  renderReader();
  try {
    S.content = await invoke('get_task_mail', { accountId: it.mail.account_id, messageId: it.mail.message_id || '' });
  } catch (e) { S.content = { error: String(e) }; }
  if (S.open && S.open.key === key) renderReader();
}
function renderReader() {
  const r = $('#reader'), m = S.open;
  r.classList.toggle('show', !!m);
  if (!m) return;
  const c = S.content;
  r.innerHTML = `<div class="rd-top"><button class="ib" data-act="close" title="${t('app.back')}">${ic('back')}</button>
      <span class="muted" style="font-size:12.5px">${esc(m.account)}</span><span class="grow"></span></div>
    <div class="rd-scroll"><div class="rd-inner">
      <div class="rd-head">${m.task ? avatar(m, 'lg') : statusAvatar(m, 'lg')}<div class="grow"><b>${esc(sender(m))}</b><br><small>${esc(m.from_addr || '')}${m.date ? ' · ' + esc(when(m.date, true)) : ''}</small></div></div>
      <h2 class="rd-subj">${esc(m.subject || t('mail.no_subject'))}</h2>
      <div class="rd-actions">${m.task
        ? `<span class="st-pill st-${m.status}"><span class="sdot"></span>${t('tasks.col_' + m.status)}</span>${taskButtons({ status: m.status, mail: m }, false)}
           <button class="ab" data-act="taskMove" data-key="${esc(m.key)}" data-to="inbox" title="${t('tasks.back_tip')}">${ic('inbox', 'sm')}${t('tasks.back')}</button>`
        : `<button class="ab main" data-act="archive" data-id="${esc(m.id)}">${ic('check', 'sm')}${t('reader.done')}</button>
           <button class="ab" data-act="task" data-id="${esc(m.id)}">${ic('task', 'sm')}${t('reader.task')}</button>
           <button class="ab ${isPinned(m.id) ? 'on' : ''}" data-act="pin" data-id="${esc(m.id)}">${ic('star', isPinned(m.id) ? 'sm filled' : 'sm')}${isPinned(m.id) ? t('reader.pinned') : t('reader.pin')}</button>
           <button class="ab" data-act="unread" data-id="${esc(m.id)}">${ic('dot', 'sm')}${t('reader.unread')}</button>`}
      </div>
      ${!c ? `<div class="loading"><div class="skel" style="width:90%"></div><div class="skel" style="width:75%"></div><div class="skel" style="width:82%"></div></div>`
        : c.error ? `<div class="loading" style="color:var(--danger)">${t('reader.load_error', { e: esc(c.error) })}</div>`
        : `${c.html ? `<div class="view-bar"><div class="seg2"><button class="${S.htmlMode ? 'on' : ''}" data-act="htmlMode" data-v="1">${t('reader.html')}</button><button class="${S.htmlMode ? '' : 'on'}" data-act="htmlMode" data-v="0">${t('reader.text')}</button></div>
              ${S.htmlMode && c.remote_images && !S.loadImages ? `<span class="img-note">${ic('image', 'sm')}${c.remote_images > 1 ? t('reader.images_blocked', { n: c.remote_images }) : t('reader.images_blocked_one')} · <button class="link" data-act="loadImages">${t('reader.load_images')}</button></span>` : ''}</div>` : ''}
           ${c.html && S.htmlMode ? '<div class="html-wrap"><iframe id="mailframe" sandbox="allow-same-origin" referrerpolicy="no-referrer" title="Mail"></iframe></div>' : `<div class="rd-body">${esc(c.text.trim() || t('mail.no_text'))}</div>`}
           ${c.attachments.length ? `<div class="att-row">${c.attachments.map(a => `<span class="att">${ic('file', 'sm')}${esc(a)}</span>`).join('')}</div>` : ''}`}
    </div></div>`;
  if (c && c.html && S.htmlMode) showHtml(c.html);
  scheduleFit();
}
/* ---- HTML-Mail: bereinigt (Backend) und zusätzlich in einem Rahmen ohne
   Skripte, mit strenger Content-Security-Policy. Bilder aus dem Netz nur auf Wunsch. ---- */
function mailDoc(html, images) {
  const csp = `default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:${images ? ' https: http:' : ''}`;
  return `<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="${csp}">
<style>html,body{margin:0;background:#fff;color:#1a1a1a;font:14px/1.55 "Inter","Cantarell","Noto Sans",system-ui,sans-serif;overflow-wrap:anywhere}
body{padding:14px}img{max-width:100%;height:auto}table{max-width:100%!important}a{color:#2563eb}pre{white-space:pre-wrap}</style></head><body>${html}</body></html>`;
}
function showHtml(html) {
  const frame = document.getElementById('mailframe');
  if (!frame) return;
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    if (S.loadImages) doc.querySelectorAll('img[data-remote-src]').forEach(img => { img.src = img.dataset.remoteSrc; });
    // Links nie im Rahmen öffnen, sondern im Browser.
    doc.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      e.preventDefault();
      const url = a.getAttribute('href');
      if (/^(https?:|mailto:)/i.test(url)) invoke('open_link', { url }).catch(err => toast(String(err), true));
    });
    const fit = () => { frame.style.height = Math.max(120, doc.documentElement.scrollHeight) + 'px'; scheduleFit(); };
    fit();
    doc.querySelectorAll('img').forEach(img => img.addEventListener('load', fit));
    new ResizeObserver(fit).observe(doc.body);
  }, { once: true });
  frame.srcdoc = mailDoc(html, S.loadImages);
}
function closeReader() { S.open = null; S.content = null; renderReader(); scheduleFit(); }

/* ---- Aktionen ---- */
async function archive(id) {
  const card = document.querySelector(`.mcard[data-id="${CSS.escape(id)}"]`);
  if (card) card.style.opacity = .4;
  try {
    const folder = await invoke('archive_mail', { id });
    if (S.open && S.open.id === id) closeReader();
    toast(t('toast.archived', { f: folder }));
  } catch (e) {
    if (card) card.style.opacity = 1;
    toast(String(e), true);
  }
}
async function setSeen(id, seen) {
  try {
    await invoke('set_seen', { id, seen });
    if (!seen) { closeReader(); toast(t('toast.unread')); }
  } catch (e) { toast(String(e), true); }
}
async function check() {
  const b = $('#checkBtn');
  b.classList.add('spin');
  await invoke('check_now').catch(() => {});
  setTimeout(() => b.classList.remove('spin'), 1200);
}
function toggleTheme() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
}
function toast(text, error, action) {
  const el = document.createElement('div');
  el.className = 'toast' + (error ? ' err' : '');
  el.textContent = text;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { el.remove(); action.run(); };
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), error ? 6000 : action ? 8000 : 3000);
}
async function togglePin(id) {
  const pinned = isPinned(id);
  // Sofort zeigen; die Synchronisation mit dem Server bestätigt es kurz danach.
  const before = S.data.pinned || [];
  const mail = S.data.mails.find(m => m.id === id) || before.find(m => m.id === id);
  S.data.pinned = pinned ? before.filter(p => p.id !== id) : (mail ? [mail, ...before] : before);
  render(); if (S.open && S.open.id === id) renderReader();
  try {
    await invoke('set_pinned', { id, pinned: !pinned });
    toast(pinned ? t('toast.unpinned') : t('toast.pinned'));
  } catch (e) {
    S.data.pinned = before; render();
    toast(String(e), true);
  }
}
async function refreshTasks() {
  try { S.tasks = await invoke('list_tasks'); } catch (e) { toast(String(e), true); }
  render();
}
async function makeTask(id) {
  try {
    const ref = await invoke('make_task', { id });
    if (S.open && S.open.id === id) closeReader();
    toast(t('toast.task'), false, ref.message_id ? {
      label: t('toast.undo'), run: () => invoke('move_task', { accountId: ref.account_id, messageId: ref.message_id, from: 'open', to: 'inbox', fromFolder: null }).then(() => toast(t('toast.back_inbox'))).catch(e => toast(String(e), true)),
    } : undefined);
  } catch (e) { toast(String(e), true); }
}
async function taskMove(key, to) {
  const it = (S.tasks || []).find(x => taskKey(x) === key);
  if (!it || !it.mail.message_id) { toast(t('toast.no_mid'), true); return; }
  const from = it.status, args = { accountId: it.mail.account_id, messageId: it.mail.message_id };
  // Sofort umsortieren; die Liste vom Server bestätigt es danach.
  const before = S.tasks;
  S.tasks = ['archive', 'inbox'].includes(to) ? S.tasks.filter(x => x !== it) : S.tasks.map(x => x === it ? { ...x, status: to } : x);
  if (S.open && S.open.key === key) closeReader();
  render();
  try {
    const folder = await invoke('move_task', { ...args, from, to, fromFolder: null });
    const label = to === 'archive' ? t('toast.task_archived') : to === 'inbox' ? t('toast.back_inbox') : t('toast.task_moved', { s: t('tasks.col_' + to) });
    toast(label, false, { label: t('toast.undo'), run: () => invoke('move_task', { ...args, from: to === 'archive' || to === 'inbox' ? 'open' : to, to: from, fromFolder: to === 'archive' || to === 'inbox' ? folder : null }).then(refreshTasks).catch(e => toast(String(e), true)) });
  } catch (e) {
    S.tasks = before; render();
    toast(String(e), true);
  }
}
async function archiveDone() {
  const done = (S.tasks || []).filter(it => it.status === 'done' && it.mail.message_id);
  if (!done.length) return;
  S.tasks = S.tasks.filter(it => it.status !== 'done'); render();
  let n = 0;
  for (const it of done) {
    try { await invoke('move_task', { accountId: it.mail.account_id, messageId: it.mail.message_id, from: 'done', to: 'archive', fromFolder: null }); n++; } catch (e) { toast(String(e), true); }
  }
  toast(t('toast.done_archived', { n }));
  refreshTasks();
}
async function archiveNoise() {
  const ids = S.data.mails.filter(m => m.bulk && (S.filter === 'all' || m.account_id === S.filter)).map(m => m.id);
  if (!ids.length) return;
  toast(t('toast.archiving', { n: ids.length }));
  try {
    const done = await invoke('archive_mails', { ids });
    toast(t('toast.noise_done', { n: done.length }), false, {
      label: t('toast.undo'),
      run: () => invoke('unarchive_mails', { items: done }).then(n => toast(t('toast.restored', { n }))).catch(e => toast(String(e), true)),
    });
  } catch (e) { toast(String(e), true); }
}
async function setKind(addr, bulk) {
  try {
    await invoke('set_sender_kind', { addr, bulk });
    toast(t(bulk ? 'toast.is_noise' : 'toast.is_person', { a: addr }), false, {
      label: t('toast.undo'), run: () => invoke('set_sender_kind', { addr, bulk: null }).then(() => toast(t('toast.auto'))),
    });
  } catch (e) { toast(String(e), true); }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#statusPop') && !e.target.closest('#statusBtn')) toggleStatus(false);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.stopPropagation();
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'open': openMail(id); break;
    case 'close': closeReader(); break;
    case 'htmlMode': S.htmlMode = el.dataset.v === '1'; renderReader(); break;
    case 'loadImages': S.loadImages = true; renderReader(); break;
    case 'home': closeReader(); S.view = 'home'; render(); break;
    case 'tasks': closeReader(); S.view = 'tasks'; render(); refreshTasks(); break;
    case 'pin': togglePin(id); break;
    case 'task': makeTask(id); break;
    case 'openTask': openTask(el.dataset.key); break;
    case 'taskMove': taskMove(el.dataset.key, el.dataset.to); break;
    case 'archiveDone': archiveDone(); break;
    case 'archive': archive(id); break;
    case 'read': setSeen(id, true); break;
    case 'unread': setSeen(id, false); break;
    case 'filter': S.filter = el.dataset.f; render(); break;
    case 'group': S.group = el.dataset.g; render(); break;
    case 'archiveNoise': archiveNoise(); break;
    case 'kind': setKind(el.dataset.addr, el.dataset.bulk === '1'); break;
    case 'check': check(); break;
    case 'status': toggleStatus(); break;
    case 'theme': toggleTheme(); break;
    case 'hide': invoke('hide_main'); break;
    case 'settings': invoke('open_window', { label: 'settings' }); break;
    case 'code': {
      const c = S.codes[+el.dataset.i];
      if (!c) break;
      if (c.kind === 'link') invoke('open_link', { url: c.code }).catch(err => toast(String(err), true));
      else invoke('copy_code', { code: c.code }).then(() => toast(t('codes.copied'))).catch(err => toast(String(err), true));
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#statusPop').classList.contains('show')) toggleStatus(false); else if (S.open) closeReader(); else invoke('hide_main'); }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('mcard')) openMail(e.target.dataset.id);
  if (S.open && (e.key === 'e' || e.key === 'E')) archive(S.open.id);
});

const saved = localStorage.getItem('theme');
if (saved) document.documentElement.dataset.theme = saved;
listen('mails-changed', () => { refresh(); refreshStatus(); });
listen('account-status', () => { refresh(); refreshStatus(); });
listen('api-status', refreshStatus);
listen('tasks-changed', refreshTasks);
setInterval(refreshTasks, 120000);
// Klick auf eine Desktop-Benachrichtigung: diese Mail öffnen.
listen('open-mail', async ev => { await refresh(); toggleStatus(false); openMail(ev.payload); });
listen('auth-code', ev => addCode(ev.payload));
invoke('get_last_code').then(p => { if (p) { const c = JSON.parse(p); if (Date.now() / 1000 - c.timestamp < CODE_TTL / 1000) addCode(c); } }).catch(() => {});
listen('settings-changed', async () => { await loadI18n(); render(); renderReader(); refreshStatus(); });
loadI18n().then(() => { render(); refresh(); refreshStatus(); refreshTasks(); });
</script>
</body>
</html>
